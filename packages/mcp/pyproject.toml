[project]
name = "agent-stack-mcp"
version = "0.0.0"
description = "MCP server exposing the knowledge graph, and an MCP client adapter for the harness (MCP 2026-07-28)."
requires-python = ">=3.15"
dependencies = [
    "mcp>=2.3.0,<3",
    "agent-stack-harness",
    "agent-stack-kg",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_stack_mcp"]

[tool.uv.sources]
agent-stack-harness = { workspace = true }
agent-stack-kg = { workspace = true }

[project]
name = "agent-stack-a2a"
version = "0.0.0"
description = "A2A agent wrapping the harness, and a demo orchestrator that delegates to it (A2A v1.0)."
requires-python = ">=3.15"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0,<2",
    "agent-stack-harness",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_stack_a2a"]

[tool.uv.sources]
agent-stack-harness = { workspace = true }

[project]
name = "agent-stack"
version = "0.0.0"
description = "Workspace root for the agent-stack learning monorepo."
requires-python = ">=3.15"
# Virtual root: not built or installed itself; it only ties the workspace together.

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "agent-stack-harness",
    "agent-stack-kg",
    "agent-stack-mcp",
    "agent-stack-a2a",
]

[tool.uv]
package = false
required-version = ">=0.13.8"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-stack-harness = { workspace = true }
agent-stack-kg = { workspace = true }
agent-stack-mcp = { workspace = true }
agent-stack-a2a = { workspace = true }

# --- ruff -----------------------------------------------------------------

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "ANN",     # annotations
    "PT",      # pytest style
]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["ANN201"]

# --- pyright --------------------------------------------------------------

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
include = ["packages"]
exclude = ["**/.venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"

# --- pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
testpaths = ["packages"]
